# YouTube growth snapshots every 2 hours (first-24-hours curves for the cross-platform lag analysis).
#
# Each run discovers new uploads for every collected channel and appends one post_snapshots row per video
# younger than 7 days (scripts/ingestion/snapshot_youtube.py). About 130-160 YouTube quota units per run,
# so about 1,800 a day against the free 10,000.
#
# The repo is public, so GitHub Actions minutes are free and unlimited.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   DATABASE_URL     the Azure connection string, starting with postgresql:// (NOT postgresql+psycopg2://)
#                    and ending with ?sslmode=require
#   YOUTUBE_API_KEY  the YouTube Data API key
# The Azure server's firewall must allow GitHub's runners ("Allow public access from any Azure service").
#
# GitHub only runs scheduled workflows from the repository's default branch (main), and may start a run a
# few minutes late. A late run is fine: a video's age is stored as fetched_at minus its exact published time.
# main holds only documents, so the job checks out the code branch below.

name: YouTube snapshots

on:
  schedule:
    # Minute 23, not :00 or :07: GitHub delays and drops scheduled runs most at the busy start of the hour.
    - cron: "23 */2 * * *"
  workflow_dispatch: {}

concurrency:
  group: youtube-snapshots
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review2-shimona-temporal

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the two packages the script needs
        run: pip install psycopg2-binary pyyaml

      # orchestrator.py refuses to import unless an `opencli` command exists, even though YouTube work never
      # calls it. This stand-in satisfies that check; any real call to it fails loudly.
      - name: Provide a stand-in opencli
        run: |
          printf '#!/bin/sh\necho "opencli is not available in this job" >&2\nexit 1\n' | sudo tee /usr/local/bin/opencli > /dev/null
          sudo chmod +x /usr/local/bin/opencli

      - name: Snapshot young videos and pick up new uploads
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/ingestion/snapshot_youtube.py
