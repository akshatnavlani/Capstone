# Backend + frontend together. Build and start with
#     docker compose up --build
# then open http://localhost:3000. The database address is read from your shell or from a .env file next to this file (DATABASE_URL), never baked into an image.
#
# 24 Nov 2026: the backend now builds from backend/Dockerfile.full, which includes ml/, the GAIL checkpoint, the creator embeddings and the
# CLIP/BERT weights, so Docker gives the same real scores as the backend run outside Docker (tested: protein brief, Sonal Kapoor 80.3, GAIL 0.96).
# The image is about 4.8 GB and needs about 3-4 GB RAM. The plain backend/Dockerfile (no models, neutral 0.5 scores) is kept for a light API-only image.
# For a deployed site set CORS_ALLOW_ORIGINS (the site's address) and API_KEY on the host, and build the frontend with NEXT_PUBLIC_API_BASE_URL = the backend's address.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.full
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - API_KEY=${API_KEY:-}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
